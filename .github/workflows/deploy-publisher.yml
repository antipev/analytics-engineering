name: Deploy Publisher

on:
  workflow_run:
    workflows: ["Bump and Publish Packages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publisher-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: my-1-st-project-training
      REGION: northamerica-northeast1
      SERVICE: malloy-publisher-mcp
      IMAGE_NAME: gcr.io/my-1-st-project-training/malloy-publisher-mcp

    steps:
      - name: Check out canonical packages at the latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out Publisher build context
        uses: actions/checkout@v4
        with:
          repository: antipev/analytics-malloy-publisher-rag
          path: publisher
          fetch-depth: 1

      - name: Authenticate to Google Cloud with workload identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve immutable image tag
        id: image
        run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Copy the semantic packages into the build context
        working-directory: publisher
        run: |
          chmod +x ./scripts/sync_semantic_layer.sh
          ./scripts/sync_semantic_layer.sh \
            ../semantic_layer/workspace \
            workspace/semantic_layer

      - name: Build the Publisher image
        working-directory: publisher
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
        run: |
          gcloud builds submit \
            --project "$PROJECT_ID" \
            --tag "$IMAGE" \
            --quiet \
            .

      - name: Deploy the Cloud Run revision
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --image "$IMAGE" \
            --platform managed \
            --region "$REGION" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 4Gi \
            --cpu 2 \
            --cpu-boost \
            --timeout 600 \
            --port 5050 \
            --set-secrets=MOTHERDUCK_TOKEN=motherduck-token:latest \
            --quiet

      - name: Route 100% of traffic to the new revision
        run: |
          REVISION=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')
          echo "New revision: ${REVISION}"

          # gcloud run deploy normally routes to the new revision, but a stale
          # control-plane response has been observed to report the old revision
          # as serving. Make the routing explicit, then assert it before the
          # smoke test so the test cannot pass against the previous revision.
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-revisions="${REVISION}=100" \
            --quiet

          for attempt in $(seq 1 24); do
            ACTIVE=$(gcloud run services describe "$SERVICE" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --format='value(status.traffic[0].revisionName)')
            if [ "$ACTIVE" = "$REVISION" ]; then
              echo "Revision ${ACTIVE} is serving 100% of traffic."
              exit 0
            fi
            echo "Waiting for ${REVISION} to receive traffic (${attempt}/24); active=${ACTIVE}..."
            sleep 5
          done

          echo "Traffic did not move to ${REVISION}." >&2
          exit 1

      - name: Smoke-test the deployed service
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')

          for attempt in $(seq 1 24); do
            body=$(curl -fsS "${URL}/api/v0/status" || true)
            # The status body mentions a package by name even when it failed to load
            # (the name appears inside loadErrors), so a substring grep passes on a
            # broken package. Parse the document instead: every package must be in
            # packages[] and loadErrors must be empty.
            if printf '%s' "$body" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(1)
          if d.get("operationalState") != "serving":
              sys.exit(1)
          loaded = {p.get("name") for e in d.get("environments", []) for p in e.get("packages", [])}
          missing = {"comics", "jaffle_shop"} - loaded
          errors = d.get("loadErrors") or []
          if missing or errors:
              packages = [e.get("package") for e in errors]
              print(f"missing={sorted(missing)} loadErrors={packages}", file=sys.stderr)
              sys.exit(1)
          '; then
              echo "Publisher is serving both semantic packages with no load errors."
              exit 0
            fi
            echo "Waiting for Publisher (${attempt}/24)..."
            sleep 10
          done

          echo "Publisher did not reach a serving state with both packages loaded." >&2
          exit 1

      - name: Verify RAG context coverage for every served package
        working-directory: publisher
        env:
          # The Node Publisher can serve a package while the RAG index holds no
          # graph for it; malloy_getContext then silently relays the call to the
          # raw source stub (fields only, no money measures, no 3-section context).
          # Warn-only until the semantic-layer build indexes every package: set the
          # repository variable ENFORCE_CONTEXT_COVERAGE=true to make it fatal.
          ENFORCE_CONTEXT_COVERAGE: ${{ vars.ENFORCE_CONTEXT_COVERAGE || 'false' }}
        run: |
          set -Eeuo pipefail
          SERVICE_URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')

          ARGS=(--base-url "$SERVICE_URL"
                --config workspace/publisher.config.json
                --require jaffle_shop:Revenue
                --require thelook_ecommerce:Total_Gross_Margin)
          if [ "${ENFORCE_CONTEXT_COVERAGE}" != "true" ]; then
            ARGS+=(--soft)
          fi

          python3 scripts/verify_context_coverage.py "${ARGS[@]}"
