substitutions:
  _TAG: latest
  _SERVICE: analytics-dagster

timeout: 1800s

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    secretEnv:
      - MOTHERDUCK_TOKEN
    args:
      - -ceu
      - |
        docker build \
          --platform linux/amd64 \
          --secret id=motherduck_token,env=MOTHERDUCK_TOKEN \
          -t "gcr.io/$PROJECT_ID/${_SERVICE}:${_TAG}" \
          .

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/motherduck-token/versions/latest
      env: MOTHERDUCK_TOKEN

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:${_TAG}
