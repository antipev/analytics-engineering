[project]
name = "xkcd_dagster"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.24",
    "duckdb>=1.5.5",
    "pandas>=2.3.3",
    "requests>=2.34.2",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.0"
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "xkcd_dagster"
registry_modules = [
    "xkcd_dagster.components.*",
]


